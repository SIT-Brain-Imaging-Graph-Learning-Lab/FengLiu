<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="color-scheme" content="light"/>
  <title>Page not found · Feng Liu</title>
  <base href="/FengLiu/"/>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Source+Sans+3:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    html,body{margin:0;height:100%;background:#fff;color:#3A3A3A;font-family:'Source Serif 4',Georgia,'Times New Roman',serif}
    .wrap{display:grid;place-items:center;height:100%;padding:2rem}
    .box{max-width:32rem;border-top:1px solid #141414;padding-top:1.5rem}
    .kicker{font-family:'Source Sans 3',Helvetica,Arial,sans-serif;font-size:.74rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#CC0033;margin:0 0 .75rem}
    h1{font-weight:600;font-size:2rem;margin:0 0 .75rem;color:#141414;letter-spacing:-.01em}
    p{margin:0 0 1rem;line-height:1.6}
    a{color:#141414;text-decoration:underline;text-decoration-color:#BFBFBB;text-underline-offset:.18em}
    a:hover{color:#CC0033;text-decoration-color:#CC0033}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="box">
      <p class="kicker">Error 404</p>
      <h1>Page not found</h1>
      <p>The page you requested does not exist or has been moved.</p>
      <p><a href="./">Return to the homepage</a></p>
    </div>
  </div>
</body>
</html>
